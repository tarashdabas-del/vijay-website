<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vijay Complaint System</title>

<style>
body{
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}
.container{
  margin-top:50px;
}
input, textarea{
  width:250px;
  padding:10px;
  margin:10px;
  border:none;
  border-radius:5px;
}
button{
  padding:10px 20px;
  border:none;
  background:gold;
  cursor:pointer;
  border-radius:5px;
}
h2{margin-top:30px;}
</style>
</head>

<body>

<div class="container">

<h2>Admin Login</h2>

<input type="password" id="adminPass" placeholder="Enter Admin Password">
<br>
<button onclick="adminLogin()">Admin Login</button>

<br><br>

<button onclick="googleLogin()">Admin Google Login</button>

<h2>Customer Complaint</h2>

<input type="text" id="name" placeholder="Name"><br>
<input type="text" id="phone" placeholder="Phone"><br>
<textarea id="problem" placeholder="Problem"></textarea><br>

<button onclick="submitComplaint()">Submit</button>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>

<script>

// ?? ?? IMPORTANT: YAHAN APNA REAL FIREBASE CONFIG DAALO
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY_HERE",
  authDomain: "PASTE_PROJECT.firebaseapp.com",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

// ?? ADMIN SETTINGS
const adminEmail = "tarashdabas@gmail.com";
const adminPassword = "tarash1234";

// ?? PASSWORD LOGIN
function adminLogin(){
  const pass = document.getElementById("adminPass").value;

  if(pass === adminPassword){
    alert("? Admin Login Success");
    window.location.href = "dashboard.html";
  } else {
    alert("? Wrong Password");
  }
}

// ?? GOOGLE LOGIN (ADMIN ONLY)
function googleLogin(){
  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
  .then(result => {
    if(result.user.email === adminEmail){
      alert("? Admin Access Granted");
      window.location.href = "dashboard.html";
    } else {
      alert("? You are not admin");
      auth.signOut();
    }
  })
  .catch(error => {
    alert(error.message);
  });
}

// ?? CUSTOMER COMPLAINT (NO LOGIN)
function submitComplaint(){
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const problem = document.getElementById("problem").value;

  if(!name || !phone || !problem){
    alert("Fill all fields");
    return;
  }

  db.collection("complaints").add({
    name:name,
    phone:phone,
    problem:problem,
    time:new Date()
  })
  .then(()=>{
    alert("? Complaint Submitted");
  })
  .catch(err=>{
    alert(err.message);
  });
}

</script>

</body>
</html>
