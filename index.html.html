<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vijay Complaint System</title>

<style>
body{font-family:Arial;background:#111;color:#fff;text-align:center}
input,button,select{padding:10px;margin:5px;width:90%;max-width:300px}
button{background:#f5b700;border:none;cursor:pointer}
table{width:100%;margin-top:20px;border-collapse:collapse}
td,th{border:1px solid #444;padding:10px}
.admin{display:none}
</style>
</head>

<body>

<h2>Complaint System</h2>

<!-- LOGIN -->
<div>
<input type="email" id="email" placeholder="Admin Email"><br>
<input type="password" id="password" placeholder="Password"><br>
<button onclick="login()">Admin Login</button>
<button onclick="googleLogin()">Google Login</button>
</div>

<hr>

<!-- CUSTOMER -->
<h3>Customer Complaint</h3>
<form id="form">
<input id="name" placeholder="Name" required><br>
<input id="phone" placeholder="Phone" required><br>
<input id="issue" placeholder="Problem" required><br>
<button type="submit">Submit</button>
</form>

<!-- ADMIN -->
<div class="admin" id="adminPanel">
<h3>Admin Dashboard</h3>
<button onclick="logout()">Logout</button>

<table>
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Phone</th>
<th>Issue</th>
<th>Status</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="data"></tbody>
</table>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
GoogleAuthProvider, signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { 
getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ?? APNA CONFIG DALNA
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ?? APNI EMAIL DAL
const ADMIN_EMAIL = "your@email.com";

// LOGIN
window.login = function(){
signInWithEmailAndPassword(auth,email.value,password.value)
.then(()=>alert("Login Success"))
.catch(e=>alert(e.message));
};

// GOOGLE LOGIN
const provider = new GoogleAuthProvider();
window.googleLogin = function(){
signInWithPopup(auth,provider)
.then(()=>alert("Google Login Success"))
.catch(e=>alert(e.message));
};

// LOGOUT
window.logout = function(){
signOut(auth);
};

// CUSTOMER SUBMIT
document.getElementById("form").addEventListener("submit",async(e)=>{
e.preventDefault();

const id = "CMP-"+Math.floor(Math.random()*100000);

await addDoc(collection(db,"complaints"),{
id,
name:name.value,
phone:phone.value,
issue:issue.value,
status:"Pending",
time:new Date().toLocaleString()
});

alert("Complaint Submitted ? ID: "+id);
form.reset();
});

// ADMIN CHECK
onAuthStateChanged(auth,(user)=>{
if(user && user.email===ADMIN_EMAIL){
adminPanel.style.display="block";
loadData();
}else{
adminPanel.style.display="none";
}
});

// LOAD DATA
async function loadData(){
const q = await getDocs(collection(db,"complaints"));
data.innerHTML="";

q.forEach(docSnap=>{
const d = docSnap.data();

data.innerHTML+=`
<tr>
<td>${d.id}</td>
<td>${d.name}</td>
<td>${d.phone}</td>
<td>${d.issue}</td>
<td>
<select onchange="updateStatus('${docSnap.id}',this.value)">
<option ${d.status=="Pending"?"selected":""}>Pending</option>
<option ${d.status=="In Progress"?"selected":""}>In Progress</option>
<option ${d.status=="Completed"?"selected":""}>Completed</option>
</select>
</td>
<td><button onclick="del('${docSnap.id}')">X</button></td>
</tr>
`;
});
}

// UPDATE
window.updateStatus = async(id,status)=>{
await updateDoc(doc(db,"complaints",id),{status});
loadData();
};

// DELETE
window.del = async(id)=>{
await deleteDoc(doc(db,"complaints",id));
loadData();
};

</script>

</body>
</html>
